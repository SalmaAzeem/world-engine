services:
  hivemq:
    image: hivemq/hivemq-ce
    container_name: campus-hivemq
    ports:
      - "1883:1883"
    volumes:
      - hivemq_data:/opt/hivemq/data
      - hivemq_log:/opt/hivemq/log
    networks:
      - campus
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: campus-postgres
    environment:
      POSTGRES_DB: thingsboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - campus
    restart: unless-stopped

  thingsboard-ce:
    image: thingsboard/tb-node:4.3.1.1
    container_name: campus-thingsboard
    depends_on:
      - postgres
    ports:
      - "9090:8080"
      - "7070:7070"
    environment:
      TB_SERVICE_ID: tb-ce-node
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/thingsboard
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      TB_QUEUE_TYPE: in-memory
    volumes:
      - thingsboard_data:/data
      - thingsboard_logs:/var/log/thingsboard
    networks:
      - campus
    restart: unless-stopped

  engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campus-world-engine
    depends_on:
      - hivemq
    environment:
      MQTT_BROKER: hivemq
      MQTT_PORT: 1883
      COAP_BIND_HOST: 0.0.0.0
      COAP_PUBLIC_HOST: engine
      DB_PATH: /app/data/state.db
      PYTHONUNBUFFERED: 1
    ports:
      - "25000-25099:25000-25099/udp"
    volumes:
      - engine_data:/app/data
    networks:
      - campus
    restart: unless-stopped

  subscriber:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campus-world-engine-subscriber
    command: ["python", "subscriber.py"]
    profiles: ["debug"]
    depends_on:
      - hivemq
      - engine
    environment:
      MQTT_BROKER: hivemq
      MQTT_PORT: 1883
      PYTHONUNBUFFERED: 1
    networks:
      - campus
    restart: unless-stopped

  gateway-f01: &gateway-template
    image: nodered/node-red:latest
    container_name: gateway-f01
    depends_on:
      - hivemq
      - engine
    ports:
      - "1891:1880"
    environment:
      TZ: Africa/Cairo
      FLOOR_ID: "01"
      MQTT_BROKER: hivemq
      MQTT_PORT: 1883
      MQTT_FLOOR_TOPIC: campus/b01/f01/#
      MQTT_COMMAND_TOPIC: campus/b01/f01/+/cmd
      COAP_BASE_URI: coap://engine
      COAP_PORT_START: 25000
      COAP_PORT_END: 25009
      THINGSBOARD_URL: http://thingsboard-ce:8080
    volumes:
      - ./infra/nodered/floor01:/data
    networks:
      - campus
    restart: unless-stopped

  gateway-f02:
